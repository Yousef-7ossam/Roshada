# ROSHDA — local/prod-like orchestration of the API + UI + PostgreSQL.
# Usage:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-roshada}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-roshada}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env
    environment:
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,api
      - DB_HOST=db          # reach Postgres by its compose service name
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-roshada}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  ui:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    environment:
      # Point the Streamlit client at the API service on the compose network.
      - API_BASE_URL=http://api:8000/api/
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  postgres_data:
